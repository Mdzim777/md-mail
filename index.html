<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MD Mail — Email temporário</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0b10;color:#f5f5f7}main{max-width:920px;margin:45px auto;padding:20px}.logo{font-size:32px;font-weight:900;letter-spacing:-1px}.logo span{color:#ff334d}.sub{color:#a5a5b3}.panel{background:#16161e;border:1px solid #33333e;border-radius:18px;padding:24px;margin-top:22px}h2{font-size:19px;margin:0 0 15px}.address{overflow-wrap:anywhere;font-size:23px;font-weight:700;background:#0e0e14;padding:17px;border-radius:12px;border:1px solid #363640}button{border:0;border-radius:10px;background:#ff334d;color:white;font-weight:700;padding:12px 17px;cursor:pointer}button.secondary{background:#30303d}button:disabled{opacity:.45;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.muted{color:#a5a5b3}.item{display:block;width:100%;text-align:left;background:#22222e;border:1px solid #393945;margin:8px 0;padding:16px;border-radius:10px}.item strong{display:block;margin:5px 0}.item small{color:#aaa}#body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.hidden{display:none}#status{min-height:24px;color:#ff8798}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}footer{margin-top:30px;color:#aaa;font-size:13px}a{color:#ff8798}label{display:flex;gap:8px;align-items:center;font-size:14px;color:#bbb}
</style></head><body><main><div class="logo">MD <span>MAIL</span></div><p class="sub">Seu email temporário, sem cadastro.</p><section class="panel"><h2>Endereço temporário</h2><div class="address" id="address">Nenhuma caixa criada</div><div class="actions"><button id="create">Gerar email</button><button id="copy" class="secondary" disabled>Copiar</button><button id="refresh" class="secondary" disabled>Atualizar caixa</button><button id="delete" class="secondary" disabled>Excluir caixa</button></div><p id="status" role="status"></p></section><section class="panel"><div class="row"><h2>Caixa de entrada</h2><label><input type="checkbox" id="auto" checked> Atualizar a cada 15 segundos</label></div><div id="messages" class="muted">Gere um endereço para começar.</div></section><section class="panel hidden" id="detail"><div class="row"><h2 id="subject"></h2><button id="back" class="secondary">Voltar</button></div><p class="muted" id="sender"></p><div id="body"></div><p id="codes"></p></section><footer>Serviço de email fornecido por <a href="https://mail.tm" target="_blank" rel="noopener noreferrer">Mail.tm</a>. Não use para mensagens confidenciais. A caixa é mantida apenas nesta aba; ao recarregar, o acesso pode ser perdido.</footer></main><script>
'use strict';
const API='/api/mail';let account=null,token=null,busy=false;
const $=id=>document.getElementById(id);
function status(s){$('status').textContent=s||''}
function randomString(n){const chars='abcdefghijklmnopqrstuvwxyz0123456789', bytes=new Uint8Array(n);crypto.getRandomValues(bytes);return Array.from(bytes,b=>chars[b%chars.length]).join('')}
async function request(path,opts={}){const response=await fetch(API+path,{...opts,headers:{Accept:'application/json',...(opts.body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});if(!response.ok){let msg='Erro '+response.status;try{const j=await response.json();msg=j['hydra:description']||j.detail||j.message||msg}catch{}throw new Error(msg)}if(response.status===204)return null;return response.json()}
function updateUI(){const yes=!!account;$('address').textContent=account?.address||'Nenhuma caixa criada';for(const id of ['copy','refresh','delete'])$(id).disabled=!yes||busy;$('create').disabled=busy;$('create').textContent=busy?'Aguarde...':'Gerar email'}
async function create(){if(busy)return;if(account&&!confirm('Criar outra caixa? Você perderá acesso à caixa atual nesta aba.'))return;busy=true;updateUI();status('Criando caixa...');try{const d=await request('/domains');const domains=(d['hydra:member']||d.member||[]).filter(x=>x.isActive&&!x.isPrivate);if(!domains.length)throw new Error('Nenhum domínio público disponível agora.');const address='md'+randomString(12)+'@'+domains[0].domain;const password=randomString(32);const created=await request('/accounts',{method:'POST',body:JSON.stringify({address,password})});const auth=await request('/token',{method:'POST',body:JSON.stringify({address,password})});account={id:created.id,address};token=auth.token;$('detail').classList.add('hidden');$('messages').textContent='Aguardando mensagens...';status('Caixa criada! Copie o endereço e aguarde mensagens.');await refresh()}catch(e){status('Não foi possível criar: '+e.message)}finally{busy=false;updateUI()}}
async function refresh(){if(!token)return;try{const d=await request('/messages');const messages=d['hydra:member']||d.member||[];const box=$('messages');box.replaceChildren();if(!messages.length){box.textContent='Nenhuma mensagem ainda.';return}for(const m of messages){const btn=document.createElement('button');btn.className='item';const from=document.createElement('small');from.textContent=m.from?.address||'Remetente desconhecido';const title=document.createElement('strong');title.textContent=m.subject||'(Sem assunto)';const intro=document.createElement('span');intro.textContent=m.intro||'';btn.append(from,title,intro);btn.addEventListener('click',()=>openMessage(m.id));box.append(btn)}status('Mensagens atualizadas.')}catch(e){status('Falha ao atualizar: '+e.message)}}
async function openMessage(id){try{const m=await request('/messages/'+encodeURIComponent(id));$('subject').textContent=m.subject||'(Sem assunto)';$('sender').textContent='De: '+(m.from?.address||'Desconhecido');$('body').textContent=m.text||'Sem versão em texto. Por segurança, HTML remoto não é exibido.';const codes=(m.verifications||[]).filter(x=>typeof x==='string');$('codes').textContent=codes.length?'Códigos detectados: '+codes.join(', '):'';$('detail').classList.remove('hidden')}catch(e){status('Não foi possível abrir: '+e.message)}}
async function remove(){if(!account||!confirm('Excluir esta caixa definitivamente?'))return;try{await request('/accounts/'+encodeURIComponent(account.id),{method:'DELETE'});account=null;token=null;$('detail').classList.add('hidden');$('messages').textContent='Gere um endereço para começar.';status('Caixa excluída.');updateUI()}catch(e){status('Falha ao excluir: '+e.message)}}
$('create').onclick=create;$('refresh').onclick=refresh;$('delete').onclick=remove;$('back').onclick=()=>$('detail').classList.add('hidden');$('copy').onclick=async()=>{if(!account)return;try{await navigator.clipboard.writeText(account.address);status('Endereço copiado!')}catch{status('Não foi possível copiar automaticamente. Selecione o endereço acima.')}};setInterval(()=>{if($('auto').checked&&token&&!document.hidden)refresh()},15000);updateUI();
</script></body></html>
