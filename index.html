
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MD Mail v4</title>
<style>
:root {
  color-scheme: dark;
  font-family: Inter, system-ui, Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0b0b10;
  color: #f5f5f7;
}
main {
  max-width: 920px;
  margin: 45px auto;
  padding: 20px;
}
.logo {
  font-size: 36px;
  font-weight: 900;
}
.logo span { color: #ff334d; }
.muted { color: #a5a5b3; }
.panel {
  background: #16161e;
  border: 1px solid #33333e;
  border-radius: 18px;
  padding: 24px;
  margin-top: 22px;
}
h2 { font-size: 19px; margin: 0 0 15px; }
.address {
  background: #0e0e14;
  border: 1px solid #363640;
  border-radius: 12px;
  padding: 18px;
  font-size: 23px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
button {
  border: 0;
  border-radius: 10px;
  background: #ff334d;
  color: white;
  font-weight: 700;
  padding: 12px 17px;
  cursor: pointer;
}
button.secondary { background: #30303d; }
button:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.item {
  display: block;
  width: 100%;
  text-align: left;
  background: #22222e;
  border: 1px solid #393945;
  border-radius: 10px;
  padding: 16px;
  margin: 8px 0;
}
.item strong {
  display: block;
  margin: 5px 0;
}
.item small { color: #aaa; }
#status {
  min-height: 24px;
  color: #ff8798;
}
#body {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}
.hidden { display: none; }
footer {
  margin-top: 30px;
  color: #aaa;
  font-size: 13px;
}
</style>
</head>
<body>
<main>
<div class="logo">MD <span>MAIL</span></div>
<p class="muted">Seu email temporário, sem cadastro.</p>

<section class="panel">
<h2>Endereço temporário</h2>
<div id="address" class="address">
  Nenhuma caixa criada
</div>
<div class="actions">
<button id="create">Gerar email</button>
<button id="copy" class="secondary" disabled>Copiar</button>
<button id="refresh" class="secondary" disabled>Atualizar caixa</button>
<button id="clear" class="secondary" disabled>Nova caixa</button>
</div>
<p id="status" role="status"></p>
</section>

<section class="panel">
<h2>Caixa de entrada</h2>
<p class="muted">Atualização automática a cada 20 segundos.</p>
<div id="messages" class="muted">
  Gere um endereço para começar.
</div>
</section>

<section class="panel hidden" id="detail">
<h2 id="subject"></h2>
<p id="sender" class="muted"></p>
<div id="body"></div>
<div class="actions">
<button id="back" class="secondary">Voltar</button>
</div>
</section>

<footer>
MD Mail v4 — Serviço de email fornecido por Guerrilla Mail.
Não utilize para mensagens confidenciais.
</footer>
</main>

<script>
"use strict";

const API = "/api/guerrilla";
const $ = id => document.getElementById(id);

let mailbox = null;
let loading = false;
let refreshing = false;

function status(message) {
  $("status").textContent = message || "";
}

function updateUI() {
  $("address").textContent =
    mailbox?.address || "Nenhuma caixa criada";

  $("create").disabled = loading;
  $("copy").disabled = !mailbox || loading;
  $("refresh").disabled = !mailbox || loading;
  $("clear").disabled = !mailbox || loading;
}

async function api(action, extra = {}) {
  const response = await fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action,
      ...(mailbox ? {
        sid_token: mailbox.sid_token
      } : {}),
      ...extra
    })
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.message || "Erro " + response.status
    );
  }

  return data;
}

async function create() {
  if (loading) return;

  loading = true;
  updateUI();
  status("Gerando endereço...");

  try {
    const data = await api("get_email_address");

    if (!data.email_addr || !data.sid_token) {
      throw new Error(
        "O provedor não retornou uma caixa válida."
      );
    }

    mailbox = {
      address: data.email_addr,
      sid_token: data.sid_token
    };

    sessionStorage.setItem(
      "mdmail",
      JSON.stringify(mailbox)
    );

    $("detail").classList.add("hidden");
    $("messages").textContent =
      "Aguardando mensagens...";

    status("Email criado com sucesso!");
    await refresh();

  } catch (error) {
    status("Erro ao gerar: " + error.message);
  } finally {
    loading = false;
    updateUI();
  }
}

async function refresh() {
  if (!mailbox || refreshing) return;

  refreshing = true;

  try {
    const data = await api("check_email");

    const messages = Array.isArray(data.list)
      ? data.list
      : [];

    const container = $("messages");
    container.replaceChildren();

    if (!messages.length) {
      container.textContent =
        "Nenhuma mensagem recebida ainda.";
      return;
    }

    for (const message of messages) {
      const button = document.createElement("button");
      button.className = "item";

      const sender = document.createElement("small");
      sender.textContent =
        message.mail_from || "Remetente desconhecido";

      const title = document.createElement("strong");
      title.textContent =
        message.mail_subject || "(Sem assunto)";

      const preview = document.createElement("span");
      preview.textContent =
        message.mail_excerpt || "";

      button.append(sender, title, preview);

      button.onclick = () =>
        openMessage(message.mail_id);

      container.append(button);
    }

  } catch (error) {
    status("Erro ao atualizar: " + error.message);
  } finally {
    refreshing = false;
  }
}

async function openMessage(id) {
  if (!mailbox) return;

  try {
    const data = await api("fetch_email", {
      email_id: id
    });

    $("subject").textContent =
      data.mail_subject || "(Sem assunto)";

    $("sender").textContent =
      "De: " + (data.mail_from || "Desconhecido");

    const html = data.mail_body || "";

    const doc = new DOMParser().parseFromString(
      html,
      "text/html"
    );

    $("body").textContent =
      doc.body.textContent || "Mensagem vazia.";

    $("detail").classList.remove("hidden");

  } catch (error) {
    status("Erro ao abrir: " + error.message);
  }
}

$("create").onclick = create;

$("copy").onclick = async () => {
  if (!mailbox) return;

  try {
    await navigator.clipboard.writeText(
      mailbox.address
    );
    status("Endereço copiado!");
  } catch {
    status("Não foi possível copiar.");
  }
};

$("refresh").onclick = refresh;

$("clear").onclick = () => {
  if (!confirm("Criar uma nova caixa temporária?")) {
    return;
  }

  mailbox = null;
  sessionStorage.removeItem("mdmail");

  $("detail").classList.add("hidden");
  $("messages").textContent =
    "Gere um endereço para começar.";

  updateUI();
  create();
};

$("back").onclick = () => {
  $("detail").classList.add("hidden");
};

try {
  const saved = JSON.parse(
    sessionStorage.getItem("mdmail")
  );

  if (saved?.address && saved?.sid_token) {
    mailbox = saved;
    refresh();
  }
} catch {
  sessionStorage.removeItem("mdmail");
}

setInterval(() => {
  if (mailbox && !document.hidden) {
    refresh();
  }
}, 20000);

updateUI();
</script>
</body>
</html>
